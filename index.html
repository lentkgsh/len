<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陳宥良SDGs 不塑永續-淨灘</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* 雲朵從左到右移動動畫 */
    @keyframes cloudDrift {
      0% {
        transform: translateX(-160px);
      }
      100% {
        transform: translateX(calc(100vw + 160px));
      }
    }

    .cloud-moving-1 {
      animation: cloudDrift 28s linear infinite;
    }

    .cloud-moving-2 {
      animation: cloudDrift 42s linear -18s infinite;
    }

    .cloud-moving-3 {
      animation: cloudDrift 35s linear -8s infinite;
    }

    /* 海浪動畫 */
    @keyframes waveMove {
      0% { transform: translateX(0) translateZ(0) scaleY(1); }
      50% { transform: translateX(-25%) translateZ(0) scaleY(0.92); }
      100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
    }

    .wave-layer {
      animation: waveMove 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
    }
    .wave-layer-slow {
      animation: waveMove 18s cubic-bezier(0.36, 0.45, 0.63, 0.53) -4s infinite;
    }

    /* 浮動加分動畫 */
    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(0.9);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-25px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-50px) scale(0.95);
      }
    }

    .score-popup {
      position: absolute;
      pointer-events: none;
      animation: floatUpFade 0.85s ease-out forwards;
      z-index: 50;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* 垃圾點擊拾取縮小動畫 */
    .trash-item {
      position: absolute;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
      touch-action: manipulation;
    }
    .trash-item:hover {
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35)) brightness(1.1);
      transform: scale(1.15) !important;
    }
    .trash-item.collected {
      pointer-events: none;
      transition: transform 0.35s ease-in, opacity 0.35s ease-in;
      transform: scale(0) rotate(180deg) !important;
      opacity: 0;
    }

    /* 陽光閃爍 */
    @keyframes sunGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .sun-glow {
      animation: sunGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-screen w-screen relative bg-slate-900 select-none">

  <!-- ================= 背景場景 ================= -->
  <!-- 1. 天空背景 (上部 45%) -->
  <div class="absolute inset-0 h-[45%] bg-gradient-to-b from-sky-400 via-sky-200 to-amber-100 overflow-hidden">
    <!-- 太陽 -->
    <div class="sun-glow absolute top-4 left-[65%] w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-200 shadow-[0_0_50px_rgba(251,191,36,0.6)] opacity-90"></div>
    
    <!-- 動態漂雲：從左往右持續飄移 -->

    <svg class="cloud-moving-1 absolute top-7 left-0 w-36 h-16 text-white/80 filter drop-shadow-sm pointer-events-none" viewBox="0 0 100 40" fill="currentColor">

      <path d="M 22 28 a 13 13 0 0 1 18 -8 a 18 18 0 0 1 30 0 a 13 13 0 0 1 18 8 z" />

    <!-- 遠方海鷗 -->

  <!-- ================= 遊戲核心邏輯 (JavaScript) ================= -->
  <script>
    /* 遊戲設定與狀態 */
    const TOTAL_TRASH = 50;
    let currentScore = 0;
    let remainingTrash = TOTAL_TRASH;
    let currentLevel = 1;
    let soundEnabled = true;

    // DOM 元素
    const trashContainer = document.getElementById('trash-container');
    const remainingCountEl = document.getElementById('remaining-count');
    const totalScoreEl = document.getElementById('total-score');
    const levelDisplayEl = document.getElementById('level-display');
    const victoryModal = document.getElementById('victory-modal');
    const modalScoreEl = document.getElementById('modal-score');
    const nextLevelBtn = document.getElementById('next-level-btn');
    const restartBtn = document.getElementById('restart-btn');
    const soundBtn = document.getElementById('sound-btn');

    /* ================= Web Audio API 音效生成器 (不需外部檔案) ================= */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pickup') {
          // 清脆拾取啵聲
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'bonus') {
          // 大件垃圾拾取雙音
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(780, now + 0.08);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        } else if (type === 'victory') {
          // 通關勝利琶音
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'sine';
            noteOsc.frequency.value = freq;
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);

            const start = now + idx * 0.1;
            noteGain.gain.setValueAtTime(0.3, start);
            noteGain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
            noteOsc.start(start);
            noteOsc.stop(start + 0.42);
          });
        }
      } catch (e) {
        console.error('Audio play error:', e);
      }
    }

    /* ================= 垃圾定義清單 (包含 SVG 圖形與積分) ================= */

      // 3. 塑膠袋 (大型 50分)
      {

      // 5. 手搖飲料杯 (中型 20分)
      {
        name: '外帶手搖杯',
        category: 'cup',
        points: 20,
        size: { width: 40, height: 60 },
        svg: `
          <svg viewBox="0 0 60 90" class="w-full h-full filter drop-shadow">
            <line x1="30" y1="4" x2="44" y2="30" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="30" cy="24" rx="20" ry="6" fill="#cbd5e1"/>
            <path d="M11,24 L18,82 Q30,88 42,82 L49,24 Z" fill="#bae6fd" opacity="0.8" stroke="#38bdf8" stroke-width="2"/>
            <rect x="18" y="44" width="24" height="20" rx="3" fill="#facc15" opacity="0.9"/>
            <circle cx="26" cy="74" r="3" fill="#78350f"/>
            <circle cx="34" cy="76" r="3" fill="#78350f"/>
            <circle cx="24" cy="79" r="2.5" fill="#78350f"/>
          </svg>`
      },
      // 6. 廢棄鐵罐 (中型 20分)
      {
        name: '生鏽鐵罐',
        category: 'can',
        points: 20,
        size: { width: 36, height: 50 },
        svg: `
          <svg viewBox="0 0 60 80" class="w-full h-full filter drop-shadow">
            <ellipse cx="30" cy="14" rx="20" ry="7" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
            <path d="M10,14 L10,64 C10,72 50,72 50,64 L50,14 Z" fill="#ea580c" opacity="0.9"/>
            <ellipse cx="30" cy="64" rx="20" ry="7" fill="#c2410c"/>
            <path d="M16,28 Q30,36 44,28" stroke="#fed7aa" stroke-width="2" fill="none"/>
            <path d="M12,44 L28,52" stroke="#7c2d12" stroke-width="3"/>
          </svg>`
      },
      // 7. 小型吸管與瓶蓋漂流物 (小型 10分)
      {
        name: '吸管與碎片',
        category: 'straw',
        points: 10,
        size: { width: 34, height: 34 },
        svg: `
          <svg viewBox="0 0 50 50" class="w-full h-full filter drop-shadow">
            <line x1="6" y1="42" x2="44" y2="8" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
            <line x1="6" y1="42" x2="44" y2="8" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 5"/>
            <circle cx="16" cy="18" r="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
          </svg>`
      },
      // 8. 漂流殘枝/木屑 (小型 10分)
      {
        name: '漂流木屑',
        category: 'driftwood',
        points: 10,
        size: { width: 44, height: 26 },
        svg: `
          <svg viewBox="0 0 70 40" class="w-full h-full filter drop-shadow">
            <path d="M6,22 Q24,14 42,24 T66,16 Q58,28 36,26 T8,28 Z" fill="#854d0e" stroke="#543007" stroke-width="2"/>
            <line x1="18" y1="22" x2="32" y2="21" stroke="#a16207" stroke-width="1.5"/>
            <line x1="42" y1="23" x2="55" y2="20" stroke="#a16207" stroke-width="1.5"/>
          </svg>`
      }
    ];

    /* ================= 生成與散佈 50 個垃圾 ================= */
    function spawnTrashItems() {
      trashContainer.innerHTML = '';
      remainingTrash = TOTAL_TRASH;
      updateHeaderStats();

      // 沙灘容器像素尺寸
      const containerWidth = trashContainer.clientWidth || window.innerWidth;
      const containerHeight = trashContainer.clientHeight || (window.innerHeight * 0.5);

      for (let i = 0; i < TOTAL_TRASH; i++) {
        // 隨機選擇一種垃圾類型
        const typeIndex = Math.floor(Math.random() * TRASH_TYPES.length);
        const itemData = TRASH_TYPES[typeIndex];

        // 隨機旋轉角度 (0 ~ 360 度)
        const rotation = Math.floor(Math.random() * 360);

        // 隨機縮放微調 (0.85 ~ 1.15 倍，讓自然度更高)
        const scale = (0.85 + Math.random() * 0.3).toFixed(2);

        // 隨機座標 (在海灘下半部範圍內，保留適當邊界防溢出)
        // 上邊界保留 4% 避開浪花交界，底部保留 8% 避開導覽列
        const marginX = 24;
        const availableWidth = Math.max(containerWidth - itemData.size.width - marginX * 2, 50);
        const leftPos = marginX + Math.random() * availableWidth;

        const topPercent = 6 + Math.random() * 82; // 6% 到 88% 的沙灘深度

        // 建立 DOM 元素
        const trashEl = document.createElement('div');
        trashEl.className = 'trash-item';
        trashEl.setAttribute('role', 'button');
        trashEl.setAttribute('aria-label', `${itemData.name}，點擊拾取可得 ${itemData.points} 分`);
        trashEl.style.width = `${itemData.size.width}px`;
        trashEl.style.height = `${itemData.size.height}px`;
        trashEl.style.left = `${leftPos}px`;
        trashEl.style.top = `${topPercent}%`;
        trashEl.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        trashEl.dataset.points = itemData.points;
        trashEl.dataset.name = itemData.name;
        trashEl.dataset.scale = scale;
        trashEl.dataset.rotation = rotation;

        // 插入 SVG
        trashEl.innerHTML = itemData.svg;

        // 點擊事件 (支援滑鼠與觸控)
        trashEl.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          collectTrash(trashEl, itemData);
        });

        trashContainer.appendChild(trashEl);
      }
    }

    /* ================= 撿起垃圾邏輯 ================= */
    function collectTrash(element, itemData) {
      if (element.classList.contains('collected')) return;

      element.classList.add('collected');

      // 更新得分與計數
      const points = itemData.points;
      currentScore += points;
      remainingTrash--;

      // 音效反饋
      playSound(points >= 30 ? 'bonus' : 'pickup');

      // 產生浮動加分文字動畫
      createFloatingScore(element, points);

      // 更新 UI 面板
      updateHeaderStats();

      // 檢查是否全數撿完
      if (remainingTrash <= 0) {
        setTimeout(handleVictory, 450);
      }
    }

    /* 浮動加分文字反饋 */
    function createFloatingScore(targetElement, points) {
      const rect = targetElement.getBoundingClientRect();
      const popup = document.createElement('div');
      popup.className = 'score-popup text-base sm:text-lg font-black';

      // 依分數高低給予鮮明色彩
      if (points >= 50) {
        popup.classList.add('text-purple-600');
        popup.textContent = `+${points} 特大垃圾!`;
      } else if (points >= 30) {
        popup.classList.add('text-amber-500');
        popup.textContent = `+${points}`;
      } else {
        popup.classList.add('text-emerald-500');
        popup.textContent = `+${points}`;
      }

      // 定位在點擊物件中心
      popup.style.left = `${rect.left + rect.width / 2}px`;
      popup.style.top = `${rect.top}px`;

      document.body.appendChild(popup);

      // 動畫結束後移除
      setTimeout(() => {
        popup.remove();
      }, 850);
    }

    /* 更新面板數據 */
    function updateHeaderStats() {
      remainingCountEl.textContent = remainingTrash;
      totalScoreEl.textContent = currentScore;
      levelDisplayEl.textContent = `第 ${currentLevel} 關`;
    }

    /* ================= 獲勝結算視窗 ================= */
    function handleVictory() {
      playSound('victory');
      modalScoreEl.textContent = `${currentScore} 分`;
      victoryModal.classList.remove('hidden');
    }

    /* 前往下一關 */
    nextLevelBtn.addEventListener('click', () => {
      victoryModal.classList.add('hidden');
      currentLevel++;
      spawnTrashItems();
    });

    /* 重新開始 (重置累積總分) */
    restartBtn.addEventListener('click', () => {
      victoryModal.classList.add('hidden');
      currentScore = 0;
      currentLevel = 1;
      spawnTrashItems();
    });

    /* 音效切換 */
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      soundBtn.title = soundEnabled ? '點擊靜音' : '點擊開啟音效';
    });

    /* 螢幕縮放時重整避免垃圾掉出邊界 (防抖動) */
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // 當視窗大幅變更時調整垃圾位置
        const items = trashContainer.querySelectorAll('.trash-item:not(.collected)');
        const containerWidth = trashContainer.clientWidth || window.innerWidth;
        items.forEach(el => {
          const w = parseFloat(el.style.width) || 40;
          const currentLeft = parseFloat(el.style.left) || 20;
          if (currentLeft + w > containerWidth - 20) {
            el.style.left = `${Math.max(20, containerWidth - w - 24)}px`;
          }
        });
      }, 150);
    });

    /* ================= 遊戲載入啟動 ================= */
    window.addEventListener('DOMContentLoaded', () => {
      spawnTrashItems();
    });
  </script>
</body>
